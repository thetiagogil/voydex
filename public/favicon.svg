<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Poketracker logo">
  <title>PokéTracker</title>
  <desc>Compact favicon matching the in-app Logo component</desc>

  <!-- outer ring -->
  <circle cx="50" cy="50" r="46" stroke="#10b981" stroke-width="4" fill="#2a2a2a" />

  <!-- cardinal direction markers (matching Logo.tsx) -->
  <g fill="#10b981">
    <polygon points="50,10 45,25 55,25" />
    <polygon points="90,50 75,45 75,55" />
    <polygon points="50,90 55,75 45,75" />
    <polygon points="10,50 25,55 25,45" />
  </g>

  <!-- central orb (solid primary) -->
  <circle cx="50" cy="50" r="20" fill="#10b981" />

  <!-- inner detail circle (background / contrast) -->
  <circle cx="50" cy="50" r="15" fill="#2a2a2a" />

  <!-- center dot -->
  <circle cx="50" cy="50" r="6" fill="#10b981" />

</svg>
