name: Feature
description: A new capability.
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What it adds and why it matters, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Today
      description: What exists now, including any placeholder it replaces.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it should work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true to close this issue.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Data or database needs, open decisions, related issues.
