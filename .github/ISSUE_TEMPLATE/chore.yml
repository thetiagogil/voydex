name: Chore
description: Tooling, docs, refactors and upkeep with no change on screen.
labels: ["type: chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The files, scripts or docs involved.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
    validations:
      required: true
