name: Database Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "database/**"
      - "scripts/database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-quality.yml"
  push:
    branches:
      - main
    paths:
      - "database/**"
      - "scripts/database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-quality.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: database-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pull the Supabase images from GitHub's registry; the default public
      # registry often refuses GitHub's shared runners ("Data limit exceeded").
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install pgFormatter
        env:
          PG_FORMATTER_VERSION: "5.11"
        run: |
          curl -fsSL "https://github.com/darold/pgFormatter/archive/refs/tags/v${PG_FORMATTER_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "PG_FORMAT_BIN=$RUNNER_TEMP/pgFormatter-${PG_FORMATTER_VERSION}/pg_format" >> "$GITHUB_ENV"

      # Signed-in pulls get their own limit; anonymous pulls share one with
      # every other runner and are often refused ("too many requests").
      - name: Sign in to GitHub's image registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Only what `db:verify` uses: the database, auth, storage, the API and the
      # mail catcher. The dashboard, realtime, functions, logs and the pooler
      # stay off, so there are fewer images to pull. The type check runs its
      # own metadata container, so `postgres-meta` stays off too.
      - name: Start local Supabase
        run: |
          # The image registry sometimes refuses a pull ("too many requests").
          # Wait and try again; images already pulled are kept, so a retry
          # only fetches what is missing.
          for attempt in 1 2 3; do
            npm run db:start -- -x studio,postgres-meta,realtime,edge-runtime,logflare,vector,supavisor && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            npm run db:stop -- --no-backup || true
            sleep $((attempt * 60))
          done

      - name: Verify database
        run: npm run db:verify

      # When the type check fails, keep the regenerated file so the diff can be read and committed.
      - name: Regenerate database types
        id: regenerate_types
        if: ${{ failure() && steps.install.outcome == 'success' }}
        run: npm run db:types

      - name: Upload regenerated database types
        if: ${{ failure() && steps.regenerate_types.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/shared/types/database.types.ts

      - name: Stop local Supabase
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run db:stop -- --no-backup
