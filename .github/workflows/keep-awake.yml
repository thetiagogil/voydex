name: Keep Awake

# A free Supabase project pauses after a week with no database activity, and
# logins and account backups stop until someone restores it by hand. This
# asks the hosted database for its time twice a week (one curl, a few
# seconds; about 9 minutes of Actions a month). A failed run emails the
# owner. Run it by hand from the Actions tab after restoring a project.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the hosted database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$SUPABASE_URL/rest/v1/rpc/keep_awake" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
