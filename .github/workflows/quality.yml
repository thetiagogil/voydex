name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on `main` never
# cancel each other, so a deploy is never stopped halfway.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pokémon images come from the separate voydex-assets site.
      NEXT_PUBLIC_ASSETS_URL: https://voydex-assets.thetiagogil.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit database sources
        run: npm run db:audit

      - name: Check documentation
        run: npm run docs:check

      - name: Check for retired design leftovers
        run: npm run design:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check architecture boundaries
        run: npm run architecture:check

      - name: Check for unused files, exports and packages
        run: npm run knip

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # Every push to `main` that passes the checks above goes live on the
  # Cloudflare Worker. If the build or upload fails, the job fails on the
  # commit and the Worker keeps serving the last good version.
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://voydex.thetiagogil.workers.dev
    # One deploy at a time; a newer merge waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ASSETS_URL: https://voydex-assets.thetiagogil.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy settings
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build and deploy to Cloudflare
        run: npm run cf:deploy
