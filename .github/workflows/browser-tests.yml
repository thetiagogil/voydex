name: Browser Tests

# Manual runs only while the app is in fast development: run it from the
# Actions tab. Before launch, restore the triggers below (a required check
# needs `pull_request`):
#
#   pull_request:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes docs skips the browser tests. The skip is
  # a job condition rather than a path filter, so the check still reports
  # (as skipped) and can be a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for changes beyond docs
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  browser-tests:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull the Supabase images from GitHub's registry; the default public
      # registry often refuses GitHub's shared runners ("Data limit exceeded").
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      # Images come from a local stand-in (e2e/support/asset-stub-server.mjs),
      # so the tests send no requests to the voydex-assets site: Vercel Hobby
      # counts each one against 1M a month. Point this at the real site to
      # test the real images.
      NEXT_PUBLIC_ASSETS_URL: http://127.0.0.1:3999

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The seed file is generated, not committed; `db:start` loads it into the
      # fresh database, test accounts included.
      - name: Build the database seed
        run: npm run db:artifacts:build

      # Only the services the app uses: the dashboard, realtime, functions,
      # logs and the pooler stay off, so there are fewer images to pull.
      #
      # When the image registry refuses a pull ("too many requests"), wait and
      # try again. Pulled images are kept, so a retry fetches only what is
      # missing. Any other failure fails at once.
      - name: Start local Supabase
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            npm run db:start -- -x studio,postgres-meta,realtime,edge-runtime,logflare,vector,supavisor 2>&1 | tee "$RUNNER_TEMP/db-start.log" && exit 0
            grep -q toomanyrequests "$RUNNER_TEMP/db-start.log" || exit 1
            [ "$attempt" -eq 3 ] && exit 1
            npm run db:stop -- --no-backup || true
            sleep $((attempt * 60))
          done

      - name: Point the app at local Supabase
        run: |
          supabase_env="$(node scripts/database/supabase.mjs status -o env 2>/dev/null)"
          api_url="$(printf '%s\n' "$supabase_env" | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          publishable_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          test -n "$api_url" && test -n "$publishable_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload the test report
        if: ${{ failure() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: e2e/.report
          retention-days: 14

      - name: Stop local Supabase
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run db:stop -- --no-backup
